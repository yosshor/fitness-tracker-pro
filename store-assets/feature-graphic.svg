<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1629"/>
      <stop offset="50%" stop-color="#0c0f1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="plate-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="plate-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="outer-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="outer-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
    <filter id="big-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#60a5fa" stroke-width="0.5">
    <line x1="0" y1="125" x2="1024" y2="125"/>
    <line x1="0" y1="250" x2="1024" y2="250"/>
    <line x1="0" y1="375" x2="1024" y2="375"/>
    <line x1="256" y1="0" x2="256" y2="500"/>
    <line x1="512" y1="0" x2="512" y2="500"/>
    <line x1="768" y1="0" x2="768" y2="500"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="250" cy="250" r="180" fill="#3b82f6" opacity="0.05" filter="url(#big-glow)"/>
  <circle cx="700" cy="280" r="140" fill="#8b5cf6" opacity="0.03" filter="url(#big-glow)"/>

  <!-- Dumbbell (left area, centered vertically) -->
  <g transform="translate(100, 130) scale(0.48)" filter="shadow">
    <rect x="98" y="186" width="36" height="140" rx="10" fill="url(#outer-l)"/>
    <rect x="142" y="202" width="32" height="108" rx="8" fill="url(#plate-l)"/>
    <rect x="174" y="238" width="164" height="36" rx="18" fill="url(#bar)"/>
    <rect x="338" y="202" width="32" height="108" rx="8" fill="url(#plate-r)"/>
    <rect x="378" y="186" width="36" height="140" rx="10" fill="url(#outer-r)"/>
    <rect x="102" y="190" width="6" height="60" rx="3" fill="#93c5fd" opacity="0.3"/>
    <rect x="146" y="206" width="5" height="44" rx="2.5" fill="#93c5fd" opacity="0.25"/>
    <rect x="382" y="190" width="6" height="60" rx="3" fill="#93c5fd" opacity="0.3"/>
    <rect x="342" y="206" width="5" height="44" rx="2.5" fill="#93c5fd" opacity="0.25"/>
    <rect x="210" y="244" width="2" height="24" rx="1" fill="#bfdbfe" opacity="0.2"/>
    <rect x="220" y="244" width="2" height="24" rx="1" fill="#bfdbfe" opacity="0.2"/>
    <rect x="230" y="244" width="2" height="24" rx="1" fill="#bfdbfe" opacity="0.2"/>
    <rect x="280" y="244" width="2" height="24" rx="1" fill="#bfdbfe" opacity="0.2"/>
    <rect x="290" y="244" width="2" height="24" rx="1" fill="#bfdbfe" opacity="0.2"/>
    <rect x="300" y="244" width="2" height="24" rx="1" fill="#bfdbfe" opacity="0.2"/>
  </g>

  <!-- Title text -->
  <g filter="url(#text-glow)">
    <text x="460" y="180" font-family="sans-serif" font-weight="700" font-size="58" fill="#ffffff" letter-spacing="-0.5">Fitness Tracker</text>
    <text x="460" y="250" font-family="sans-serif" font-weight="700" font-size="58" letter-spacing="-0.5">
      <tspan fill="#60a5fa">Pro</tspan>
    </text>
  </g>

  <!-- Accent line -->
  <rect x="460" y="272" width="160" height="2" rx="1" fill="url(#accent-line)"/>

  <!-- Tagline -->
  <text x="460" y="312" font-family="sans-serif" font-weight="400" font-size="22" fill="#94a3b8" letter-spacing="0.5">AI-Powered Gym Companion</text>

  <!-- Feature pills -->
  <g font-family="sans-serif" font-size="13" font-weight="500">
    <rect x="460" y="345" width="125" height="30" rx="15" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="522" y="365" text-anchor="middle" fill="#93c5fd">AI Workouts</text>

    <rect x="596" y="345" width="110" height="30" rx="15" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="651" y="365" text-anchor="middle" fill="#c4b5fd">Smart Log</text>

    <rect x="717" y="345" width="110" height="30" rx="15" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    <text x="772" y="365" text-anchor="middle" fill="#6ee7b7">Analytics</text>

    <rect x="838" y="345" width="120" height="30" rx="15" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1"/>
    <text x="898" y="365" text-anchor="middle" fill="#fcd34d">AI Coach</text>
  </g>
</svg>
