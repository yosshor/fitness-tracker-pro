<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1629"/>
      <stop offset="100%" stop-color="#0c0f1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="plate-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="plate-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="outer-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="outer-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="out"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle radial glow behind dumbbell -->
  <circle cx="256" cy="256" r="140" fill="#3b82f6" opacity="0.06"/>
  <circle cx="256" cy="256" r="90" fill="#3b82f6" opacity="0.04"/>

  <!-- Dumbbell group with shadow -->
  <g filter="shadow">
    <!-- Left outer plate -->
    <rect x="98" y="186" width="36" height="140" rx="10" fill="url(#outer-l)"/>
    <!-- Left inner plate -->
    <rect x="142" y="202" width="32" height="108" rx="8" fill="url(#plate-l)"/>
    <!-- Bar -->
    <rect x="174" y="238" width="164" height="36" rx="18" fill="url(#bar)"/>
    <!-- Right inner plate -->
    <rect x="338" y="202" width="32" height="108" rx="8" fill="url(#plate-r)"/>
    <!-- Right outer plate -->
    <rect x="378" y="186" width="36" height="140" rx="10" fill="url(#outer-r)"/>

    <!-- Highlights on plates -->
    <rect x="102" y="190" width="6" height="60" rx="3" fill="#93c5fd" opacity="0.3"/>
    <rect x="146" y="206" width="5" height="44" rx="2.5" fill="#93c5fd" opacity="0.25"/>
    <rect x="382" y="190" width="6" height="60" rx="3" fill="#93c5fd" opacity="0.3"/>
    <rect x="342" y="206" width="5" height="44" rx="2.5" fill="#93c5fd" opacity="0.25"/>

    <!-- Bar grip lines -->
    <rect x="210" y="244" width="2" height="24" rx="1" fill="#bfdbfe" opacity="0.2"/>
    <rect x="220" y="244" width="2" height="24" rx="1" fill="#bfdbfe" opacity="0.2"/>
    <rect x="230" y="244" width="2" height="24" rx="1" fill="#bfdbfe" opacity="0.2"/>
    <rect x="280" y="244" width="2" height="24" rx="1" fill="#bfdbfe" opacity="0.2"/>
    <rect x="290" y="244" width="2" height="24" rx="1" fill="#bfdbfe" opacity="0.2"/>
    <rect x="300" y="244" width="2" height="24" rx="1" fill="#bfdbfe" opacity="0.2"/>
  </g>

  <!-- "FT" text below -->
  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="48" fill="#60a5fa" letter-spacing="6">FT PRO</text>
</svg>
