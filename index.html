<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="AI-Powered Fitness Tracker - Track workouts, generate personalized routines, and monitor your progress">
    <meta name="theme-color" content="#0c0f1a">
    <title>Fitness Tracker Pro</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="/index.css">

    <!-- Load Google Fonts fully async — never block first paint, especially on Android WebView -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Inline critical styles to avoid FOUC -->
    <style>
      body { background-color: #0c0f1a; color: #f8fafc; margin: 0; }
      #root { min-height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <!-- Load fonts after app JS to avoid competing for the main thread -->
    <script>
      requestAnimationFrame(function() {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap';
        document.head.appendChild(link);
      });
    </script>
</body>
</html>
